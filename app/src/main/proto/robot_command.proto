syntax = "proto3";

package com.ubtrobot.mini.sdkdemo.socket;

option java_package = "com.ubtrobot.mini.sdkdemo.socket";
option java_outer_classname = "RobotRequestProto";

message RobotRequest {
  string type = 1;
  repeated sint32 asr = 2;
  bytes image = 3;
  map<string, string> params = 4;
  string speech = 5;
}